name: i18n Validation & Auto-sync

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/**/*.{ts,tsx}'
      - 'src/i18n/**/*'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'src/**/*.{ts,tsx}'
      - 'src/i18n/**/*'
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'

jobs:
  # Job 1: Extract and validate i18n strings
  validate-i18n:
    name: Validate Translations
    runs-on: ubuntu-latest
    outputs:
      coverage_en: ${{ steps.check.outputs.coverage_en }}
      coverage_id: ${{ steps.check.outputs.coverage_id }}
      needs_translation: ${{ steps.check.outputs.needs_translation }}
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🔍 Extract i18n strings
        id: extract
        run: |
          npm run extract-i18n || true
          echo "✅ Extraction complete"
        continue-on-error: true
      
      - name: ✅ Run i18n validation
        id: check
        run: |
          npm run i18n-check
          
          # Extract coverage from report
          COVERAGE_EN=$(cat .i18n-check-report.json | jq -r '.coverage.en')
          COVERAGE_ID=$(cat .i18n-check-report.json | jq -r '.coverage.id')
          MISSING_COUNT=$(cat .i18n-check-report.json | jq -r '.missingKeys.id | length')
          EMPTY_COUNT=$(cat .i18n-check-report.json | jq -r '.emptyTranslations.id | length')
          
          echo "coverage_en=$COVERAGE_EN" >> $GITHUB_OUTPUT
          echo "coverage_id=$COVERAGE_ID" >> $GITHUB_OUTPUT
          
          # Check if translation is needed
          if [ $MISSING_COUNT -gt 0 ] || [ $EMPTY_COUNT -gt 0 ]; then
            echo "needs_translation=true" >> $GITHUB_OUTPUT
          else
            echo "needs_translation=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true
      
      - name: 🎨 Generate coverage badges
        run: npm run generate-badges
      
      - name: 📊 Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: i18n-validation-report
          path: |
            .i18n-check-report.json
            .i18n-extraction-report.json
            I18N_COVERAGE.md
          retention-days: 30
      
      - name: 💬 Comment on PR with coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('.i18n-check-report.json', 'utf8'));
            const coverage = fs.readFileSync('I18N_COVERAGE.md', 'utf8');
            
            let comment = `## 🌐 i18n Validation Report\n\n`;
            comment += coverage + '\n\n';
            
            if (report.warnings.length > 0) {
              comment += `### ⚠️ Warnings (${report.warnings.length})\n\n`;
              report.warnings.forEach(w => {
                comment += `- ${w}\n`;
              });
              comment += '\n';
            }
            
            if (report.missingKeys.id.length > 0) {
              comment += `### 🔍 Missing Indonesian Translations (${report.missingKeys.id.length})\n\n`;
              comment += '<details><summary>Click to expand</summary>\n\n';
              report.missingKeys.id.slice(0, 20).forEach(key => {
                comment += `- \`${key}\`\n`;
              });
              if (report.missingKeys.id.length > 20) {
                comment += `\n*... and ${report.missingKeys.id.length - 20} more*\n`;
              }
              comment += '\n</details>\n\n';
            }
            
            if (report.errors.length > 0) {
              comment += `### ❌ Errors (${report.errors.length})\n\n`;
              report.errors.forEach(e => {
                comment += `- ${e}\n`;
              });
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
  
  # Job 2: TypeScript type check
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    needs: validate-i18n
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🔍 Run TypeScript type check
        run: npx tsc --noEmit
  
  # Job 3: Build test
  build:
    name: Build Test
    runs-on: ubuntu-latest
    needs: typecheck
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🏗️ Build project
        run: npm run build
      
      - name: 📊 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build/
          retention-days: 7
  
  # Job 4: Auto-create PR for missing translations
  auto-pr:
    name: Auto-create Translation PR
    runs-on: ubuntu-latest
    needs: validate-i18n
    if: |
      github.event_name == 'push' && 
      github.ref == 'refs/heads/main' &&
      needs.validate-i18n.outputs.needs_translation == 'true'
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🔍 Extract i18n strings
        run: npm run extract-i18n
      
      - name: 🌿 Create branch
        id: create-branch
        run: |
          BRANCH_NAME="i18n/auto-sync-$(date +%Y%m%d-%H%M%S)"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b $BRANCH_NAME
      
      - name: 📝 Update translation files
        run: |
          # Run extraction and update files
          npm run extract-i18n
          
          # Check if there are changes
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git add src/i18n/locales/*.ts
          git commit -m "feat(i18n): add missing Indonesian translation stubs
          
          Auto-generated by GitHub Actions
          
          This PR adds missing translation keys to id.ts with /* TRANSLATE */ markers.
          Please review and provide Indonesian translations for the marked keys.
          
          Coverage: ${{ needs.validate-i18n.outputs.coverage_id }}%"
          
          git push origin ${{ steps.create-branch.outputs.branch_name }}
      
      - name: 🔀 Create Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('.i18n-check-report.json', 'utf8'));
            
            let body = `## 🌐 Auto-generated i18n Translation PR\n\n`;
            body += `This PR contains missing Indonesian translation keys that need to be translated.\n\n`;
            body += `### 📊 Coverage\n\n`;
            body += `- **English:** ${{ needs.validate-i18n.outputs.coverage_en }}%\n`;
            body += `- **Indonesian:** ${{ needs.validate-i18n.outputs.coverage_id }}%\n\n`;
            body += `### 🔍 Missing Translations (${report.missingKeys.id.length})\n\n`;
            
            report.missingKeys.id.slice(0, 30).forEach(key => {
              body += `- [ ] \`${key}\`\n`;
            });
            
            if (report.missingKeys.id.length > 30) {
              body += `\n*... and ${report.missingKeys.id.length - 30} more*\n`;
            }
            
            body += `\n### ✅ To Do\n\n`;
            body += `- [ ] Review all keys marked with \`/* TRANSLATE */\`\n`;
            body += `- [ ] Provide Indonesian translations\n`;
            body += `- [ ] Ensure technical terms are not translated\n`;
            body += `- [ ] Test all pages in Indonesian locale\n`;
            
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🌐 [i18n] Add missing Indonesian translations',
              head: '${{ steps.create-branch.outputs.branch_name }}',
              base: 'main',
              body: body
            });
            
            // Add labels
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: ['i18n', 'needs-translation', 'auto-generated']
            });
            
            console.log(`✅ Created PR #${pr.number}`);
  
  # Job 5: E2E smoke tests for i18n
  e2e-smoke-tests:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🧪 Install Playwright
        run: npx playwright install --with-deps chromium
      
      - name: 🚀 Run smoke tests
        run: npm run test:e2e:smoke || true
        continue-on-error: true
      
      - name: 📊 Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
